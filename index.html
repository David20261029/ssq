<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双色球 AI 选号</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#1e2a4a,#0b0f1a 70%);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8ecf4;padding:20px}
  h1{font-size:22px;letter-spacing:2px;margin:0 0 6px}
  .sub{font-size:12px;color:#7f8aa3;margin-bottom:26px}
  .board{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px 18px;display:flex;flex-wrap:wrap;gap:9px;justify-content:center;align-items:center;min-height:96px;width:100%;max-width:420px}
  .ball{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;box-shadow:inset -3px -4px 10px rgba(0,0,0,.35),inset 3px 3px 8px rgba(255,255,255,.25),0 5px 14px rgba(0,0,0,.45)}
  .red{background:radial-gradient(circle at 32% 28%,#ff7b7b,#b02a1f)}
  .blue{background:radial-gradient(circle at 32% 28%,#6dc0f0,#155a8a);margin-left:6px}
  .pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.5);opacity:.3}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .empty .ball{opacity:.18}
  .btns{display:flex;gap:12px;margin-top:24px}
  button{border:none;cursor:pointer;padding:13px 26px;border-radius:999px;font-size:15px;font-weight:600;color:#fff;letter-spacing:1px;transition:transform .12s,filter .2s}
  button:active{transform:scale(.95)}
  button:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
  .smart{background:linear-gradient(135deg,#e74c3c,#c0392b);box-shadow:0 8px 22px rgba(231,76,60,.35)}
  .random{background:linear-gradient(135deg,#3498db,#2471a3);box-shadow:0 8px 22px rgba(52,152,219,.35)}
  .tip{margin-top:26px;font-size:11px;color:#5f6b85;text-align:center;line-height:1.7}
</style>
</head>
<body>
  <h1>🎱 双色球 AI 选号</h1>
  <div class="sub">点击按钮，生成一注（6 红 + 1 蓝）</div>
  <div class="board empty" id="board">
    <div class="ball red">?</div><div class="ball red">?</div><div class="ball red">?</div>
    <div class="ball red">?</div><div class="ball red">?</div><div class="ball red">?</div>
    <div class="ball blue">?</div>
  </div>
  <div class="btns">
    <button class="smart" id="smartBtn">智能选号</button>
    <button class="random" id="randomBtn">纯随机</button>
  </div>
  <div class="tip">仅供娱乐参考 · 理性购彩<br>每期开奖均为独立随机事件，任何算法都无法预测</div>
<script>
const RED_POOL=Array.from({length:33},(_,i)=>i+1);
const BLUE_POOL=Array.from({length:16},(_,i)=>i+1);
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function weightedSample(pool,k,wf){const c=[...pool],o=[];for(let i=0;i<k;i++){const w=c.map(wf),t=w.reduce((a,b)=>a+b,0);let r=Math.random()*t,idx=c.length-1;for(let j=0;j<c.length;j++){r-=w[j];if(r<=0){idx=j;break;}}o.push(c[idx]);c.splice(idx,1);}return o.sort((a,b)=>a-b);}
const rw=n=>(n>=10&&n<=25)?1.2:(n<=5||n>=30?0.7:1.0);
const bw=n=>(n>=5&&n<=12)?1.3:0.8;
const sumOk=r=>{const s=r.reduce((a,b)=>a+b,0);return s>=70&&s<=140;};
const noTriple=r=>{for(let i=0;i<r.length-2;i++)if(r[i+1]===r[i]+1&&r[i+2]===r[i]+2)return false;return true;};
function genSmart(){let r,b,g=0;do{r=weightedSample(RED_POOL,6,rw);b=weightedSample(BLUE_POOL,1,bw)[0];g++;}while((!sumOk(r)||!noTriple(r))&&g<500);return{red:r,blue:b};}
function genRandom(){return{red:shuffle(RED_POOL).slice(0,6).sort((a,b)=>a-b),blue:BLUE_POOL[Math.floor(Math.random()*BLUE_POOL.length)]};}
const board=document.getElementById('board'),redBalls=board.querySelectorAll('.ball.red'),blueBall=board.querySelector('.ball.blue'),smartBtn=document.getElementById('smartBtn'),randomBtn=document.getElementById('randomBtn'),pad=n=>String(n).padStart(2,'0');
function render(d,anim){board.classList.remove('empty');d.red.forEach((n,i)=>{redBalls[i].textContent=pad(n);if(anim){redBalls[i].classList.remove('pop');void redBalls[i].offsetWidth;redBalls[i].classList.add('pop');}});blueBall.textContent=pad(d.blue);if(anim){blueBall.classList.remove('pop');void blueBall.offsetWidth;blueBall.classList.add('pop');}}
let rolling=false;
function playRoll(finalData){if(rolling)return;rolling=true;smartBtn.disabled=randomBtn.disabled=true;let ticks=0;const timer=setInterval(()=>{const t=genRandom();board.classList.remove('empty');redBalls.forEach((b,i)=>{b.textContent=pad(t.red[i]);});blueBall.textContent=pad(t.blue);if(++ticks>=10){clearInterval(timer);render(finalData,true);rolling=false;smartBtn.disabled=randomBtn.disabled=false;}},55);}
smartBtn.addEventListener('click',()=>playRoll(genSmart()));
randomBtn.addEventListener('click',()=>playRoll(genRandom()));
</script>
</body>
</html>
