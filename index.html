<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双色球 AI 选号 · 5注</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#1e2a4a,#0b0f1a 70%);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8ecf4;padding:18px 14px}
  h1{font-size:20px;letter-spacing:1.5px;margin:0 0 5px;text-align:center}
  .sub{font-size:12px;color:#7f8aa3;margin-bottom:18px;text-align:center}
  .tickets{width:100%;max-width:400px;display:flex;flex-direction:column;gap:8px}
  .ticket{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px 10px;display:flex;align-items:center;gap:5px}
  .no{font-size:11px;color:#6b7794;width:14px;flex:none;text-align:center}
  .ball{width:31px;height:31px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;box-shadow:inset -2px -3px 7px rgba(0,0,0,.35),inset 2px 2px 5px rgba(255,255,255,.25),0 3px 9px rgba(0,0,0,.45)}
  .red{background:radial-gradient(circle at 32% 28%,#ff7b7b,#b02a1f)}
  .blue{background:radial-gradient(circle at 32% 28%,#6dc0f0,#155a8a);margin-left:3px}
  .pop{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:.4}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .empty .ball{opacity:.16}
  .btns{display:flex;gap:12px;margin-top:20px}
  button{border:none;cursor:pointer;padding:13px 26px;border-radius:999px;font-size:15px;font-weight:600;color:#fff;letter-spacing:1px;transition:transform .12s,filter .2s}
  button:active{transform:scale(.95)}
  button:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
  .smart{background:linear-gradient(135deg,#e74c3c,#c0392b);box-shadow:0 8px 22px rgba(231,76,60,.35)}
  .random{background:linear-gradient(135deg,#3498db,#2471a3);box-shadow:0 8px 22px rgba(52,152,219,.35)}
  .tip{margin-top:20px;font-size:11px;color:#5f6b85;text-align:center;line-height:1.7}
  .link{margin-top:12px;font-size:13px;color:#6dc0f0;text-decoration:none}
</style>
</head>
<body>
  <h1>🎱 双色球 AI 选号</h1>
  <div class="sub">每次生成 5 注 · 每注 6 红 + 1 蓝</div>

  <div class="tickets empty" id="tickets"></div>

  <div class="btns">
    <button class="smart" id="smartBtn">智能选号</button>
    <button class="random" id="randomBtn">纯随机</button>
  </div>

  <div class="tip">仅供娱乐参考 · 理性购彩<br>每期开奖均为独立随机事件，任何算法都无法预测</div>
  <a class="link" href="dlt.html">→ 切换到超级大乐透</a>

<script>
const COUNT = 5;
const RED_POOL  = Array.from({length:33},(_,i)=>i+1);
const BLUE_POOL = Array.from({length:16},(_,i)=>i+1);

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function weightedSample(pool,k,wf){
  const c=[...pool],o=[];
  for(let i=0;i<k;i++){
    const w=c.map(wf),t=w.reduce((a,b)=>a+b,0);
    let r=Math.random()*t,idx=c.length-1;
    for(let j=0;j<c.length;j++){ r-=w[j]; if(r<=0){idx=j;break;} }
    o.push(c[idx]); c.splice(idx,1);
  }
  return o.sort((a,b)=>a-b);
}

const rw = n => (n>=10&&n<=25) ? 1.2 : (n<=5||n>=30 ? 0.7 : 1.0);
const bw = n => (n>=5&&n<=12)  ? 1.3 : 0.8;

const sumOk    = r => { const s=r.reduce((a,b)=>a+b,0); return s>=70 && s<=140; };
const noTriple = r => {
  for(let i=0;i<r.length-2;i++)
    if(r[i+1]===r[i]+1 && r[i+2]===r[i]+2) return false;
  return true;
};

function genSmart(){
  let red,blue,g=0;
  do{
    red  = weightedSample(RED_POOL,6,rw);
    blue = weightedSample(BLUE_POOL,1,bw)[0];
    g++;
  }while((!sumOk(red)||!noTriple(red)) && g<500);
  return {red,blue};
}

function genRandom(){
  return {
    red:  shuffle(RED_POOL).slice(0,6).sort((a,b)=>a-b),
    blue: BLUE_POOL[Math.floor(Math.random()*BLUE_POOL.length)]
  };
}

/* ---------- 构建 5 行结构 ---------- */
const board = document.getElementById('tickets');
const pad = n => String(n).padStart(2,'0');
const rows = [];

for(let t=0;t<COUNT;t++){
  const row = document.createElement('div');
  row.className = 'ticket';

  const no = document.createElement('span');
  no.className = 'no';
  no.textContent = t+1;
  row.appendChild(no);

  const reds = [];
  for(let i=0;i<6;i++){
    const b = document.createElement('div');
    b.className = 'ball red';
    b.textContent = '?';
    row.appendChild(b);
    reds.push(b);
  }

  const blue = document.createElement('div');
  blue.className = 'ball blue';
  blue.textContent = '?';
  row.appendChild(blue);

  board.appendChild(row);
  rows.push({reds, blue});
}

/* ---------- 渲染 ---------- */
function render(tickets, anim){
  board.classList.remove('empty');
  tickets.forEach((tk,i)=>{
    const r = rows[i];
    tk.red.forEach((n,j)=>{ r.reds[j].textContent = pad(n); });
    r.blue.textContent = pad(tk.blue);
  });
  if(anim){
    rows.forEach(r=>{
      [...r.reds, r.blue].forEach(el=>{
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
      });
    });
  }
}

const smartBtn  = document.getElementById('smartBtn');
const randomBtn = document.getElementById('randomBtn');

let rolling = false;
function playRoll(finalTickets){
  if(rolling) return;
  rolling = true;
  smartBtn.disabled = randomBtn.disabled = true;
  board.classList.remove('empty');
  let ticks = 0;
  const timer = setInterval(()=>{
    render(Array.from({length:COUNT}, genRandom), false);
    if(++ticks >= 10){
      clearInterval(timer);
      render(finalTickets, true);
      rolling = false;
      smartBtn.disabled = randomBtn.disabled = false;
    }
  }, 60);
}

smartBtn.addEventListener('click', ()=> playRoll(Array.from({length:COUNT}, genSmart)));
randomBtn.addEventListener('click', ()=> playRoll(Array.from({length:COUNT}, genRandom)));
</script>
</body>
</html>
